name: compilar y subir PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          latexmk \
          biber \
          texlive-xetex \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-lang-spanish \
          texlive-science \
          texlive-bibtex-extra \
          texlive-pictures

      # latexmk lee la configuracion de .latexmkrc (xelatex, biber, makeindex)
      # y repite la compilacion hasta que las referencias se estabilizan
      - name: compile PDF
        run: |
          latexmk \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            principal.tex

      - name: show logs on failure
        if: failure()
        run: |
          for f in principal.log principal.blg; do
            [ ! -f "$f" ] || cat "$f"
          done

      - name: preparar sitio
        run: |
          mkdir site
          cp principal.pdf site/maquinas-sonoras.pdf

          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Máquinas sonoras</title>
            <style>
              body { font-family: sans-serif; margin: 0; }
              .content { padding: 1rem; background: #111; color: white; }
              .content a { color: white; }
              iframe { width: 100%; height: 90vh; border: none; }
            </style>
          </head>
          <body>
            <div class="content">Máquinas sonoras: electrónicas y computacionales — <a href="maquinas-sonoras.pdf">descargar PDF</a></div>
            <iframe id="viewer" src="maquinas-sonoras.pdf"></iframe>
          </body>
          </html>
          EOF

      - name: upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: check GitHub Pages status
        id: pages-status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.warning('GitHub Pages is not enabled for this repository; skipping deployment.');
                core.setOutput('enabled', 'false');
                return;
              }
              throw error;
            }

      - name: deploy to GitHub Pages
        id: deployment
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: skip deploy when Pages is disabled
        if: steps.pages-status.outputs.enabled != 'true'
        run: echo "GitHub Pages is disabled. Enable it in Settings > Pages to publish."
